[manifest]
version = "1.0.0"
priority = -2

[vars]

# kindness last resort reset
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if change_context ~= 'splash' then "
position = "before"
payload = '''
G.P_CENTERS.e_foil.config.chips = 50
G.P_CENTERS.e_holo.config.mult = 10
G.P_CENTERS.e_polychrome.config.x_mult = 1.5
'''
match_indent = true

# gerson
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
 if center_table.name == 'Clearance Sale' or center_table.name == 'Liquidation' then
	G.E_MANAGER:add_event(Event({func = function()
		G.GAME.discount_percent = G.GAME.discount_percent + center_table.extra
		for k, v in pairs(G.I.CARD) do
			if v.set_cost then v:set_cost() end
		end
		return true end }))
end
'''
position = "at"
payload = '''
 if center_table.name == 'Clearance Sale' or center_table.name == 'Liquidation' then
	G.E_MANAGER:add_event(Event({func = function()
		if center_table.name == 'Clearance Sale' then
			G.GAME.discount_percent_storage = center_table.extra
			G.GAME.discount_percent = G.GAME.discount_percent + center_table.extra
		else
			if G.GAME.discount_percent_storage then
				G.GAME.discount_percent = G.GAME.discount_percent - G.GAME.discount_percent_storage
				G.GAME.discount_percent_storage = nil
			end
			G.GAME.discount_percent = G.GAME.discount_percent + center_table.extra
		end
		for k, v in pairs(G.I.CARD) do
			if v.set_cost then v:set_cost() end
		end
		return true end }))
end
G.GAME.discount_percent = G.GAME.discount_percent + center_table.extra
'''
match_indent = true

# barrier
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = "card_eval_status_text(card, 'debuff')"
position = "after"
payload = "SMODS.calculate_context({debuffed_individual = true, other_card = new_card})"
match_indent = true



