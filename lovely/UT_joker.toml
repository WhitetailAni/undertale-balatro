[manifest]
version = "1.0.0"
priority = -2

[vars]

# kindness last resort reset
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if change_context ~= 'splash' then "
position = "before"
payload = '''
G.P_CENTERS.e_foil.config.chips = 50
G.P_CENTERS.e_holo.config.mult = 10
G.P_CENTERS.e_polychrome.config.x_mult = 1.5
'''
match_indent = true

# gerson
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "G.GAME.discount_percent = center_table.extra"
position = "at"
payload = "G.GAME.discount_percent = G.GAME.discount_percent + center_table.extra"
match_indent = false

# barrier
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = "card_eval_status_text(card, 'debuff')"
position = "after"
payload = "SMODS.calculate_context({debuffed_individual = true, other_card = new_card})"
match_indent = true

# gaster text color
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = '''
enhanced = G.C.SECONDARY_SET.Enhanced
'''
position = "before"
payload = '''
joker_grey = G.C.JOKER_GREY,
gaster = G.C.GASTER,
ballgame = G.C.BALLGAME,
steel = G.C.STEEL,
FRIEND = G.C.FRIEND,
FRIEND_PINK = G.C.FRIEND_PINK,
FRIEND_YELLOW = G.C.FRIEND_YELLOW,
watercooler = G.C.WATERCOOLER,
netskie = G.C.NETSKIE,

flower_aqua = G.C.FLOWER_AQUA,
flower_seth = G.C.FLOWER_SETH,
flower_orange = G.C.FLOWER_ORANGE,
flower_green = G.C.FLOWER_GREEN,
flower_blue = G.C.FLOWER_BLUE,
flower_yellow = G.C.FLOWER_YELLOW,

catty = G.C.CATTY,
bratty = G.C.BRATTY,
points = G.C.POINTS,
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "globals.lua"
pattern = '''
RENTAL = HEX('b18f43'),
'''
position = "after"
payload = '''
GASTER = HEX('000000'),
BALLGAME = HEX('ff0000'),
FRIEND = HEX('eeeeee'),
FRIEND_PINK = HEX('fda9c0'),
FRIEND_YELLOW = HEX('ffdd45'),
WATERCOOLER = HEX('2d9bd7'),
STEEL = HEX('afb4be'),
NETSKIE = HEX('ff00d6'),
POINTS = HEX('339e72'),

BRATTY = HEX('e7b1c5'),
CATTY = HEX('cbafed'),
DOG = HEX('dddddd'),

FLOWER_AQUA = HEX('46e3ff'),
FLOWER_SETH = HEX('bd39bd'),
FLOWER_ORANGE = HEX('ffa040'),
FLOWER_GREEN = HEX('00a651'),
FLOWER_BLUE = HEX('00aef0'),
FLOWER_YELLOW = HEX('fff200'),

FLOWER_AQUA_BG = HEX('3ab1c6'),
FLOWER_SETH_BG = HEX('b141b1'),
FLOWER_YELLOW_BG = HEX('b1a906'),

'''
match_indent = true



