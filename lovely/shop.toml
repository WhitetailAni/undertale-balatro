[manifest]
version = "1.0.0"
priority = 1

[vars]
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'if self.ability.rental then self.cost = 1 end'
position = 'after'
payload = '''
if #SMODS.find_card('j_UTDR_oddcontroller') > 0 and (self.config.center.rarity == 2 or self.config.center.rarity == 3) then self.cost = 0 end
if self.config.center.key == "j_UTDR_netskie" and key then self.cost = G.P_CENTERS[key].cost end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
function Card:set_cost()
    self.extra_cost = 0 + G.GAME.inflation

    self:set_cost_value()
    self:set_sell_value()
'''
position = "at"
payload = '''
function Card:set_cost(key)
    self.extra_cost = 0 + G.GAME.inflation

    self:set_cost_value(key)
    self:set_sell_value()
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
function Card:set_sell_value()
    self.sell_cost = math.max(1, math.floor(self.cost/2)) + (self.ability.extra_value or 0)
end
'''
position = "at"
payload = '''
function Card:set_sell_value()
    self.sell_cost = math.max(1, math.floor(self.cost/2)) + (self.ability.extra_value or 0)
    if self.config.center.key == "j_UTDR_netskie" and key then self.sell_cost = 2 end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "function Card:set_cost_value()"
position = "at"
payload = "function Card:set_cost_value(key)"
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/overrides.lua"]'''
pattern = '''
local all_unavailable = true
for _, v in ipairs(pool) do
	if not G.P_CENTERS[v.key] or G.P_CENTERS[v.key].kind ~= _type then
		v.key = "UNAVAILABLE"
	else
		all_unavailable = false
	end
end
if all_unavailable then
	pool[#pool+1] = {key = 'p_buffoon_normal_1', type = "Booster"}
end
'''
position = "after"
payload = '''
print("hello this is my test message in get pack")
local has_seam = #SMODS.find_card('j_UTDR_seam') > 0
local has_shelter = #SMODS.find_card('j_UTDR_sjelter') > 0
if not all_unavailable and (has_seam or has_shelter) then
	if has_seam then
		print("seam is here")
	end
	if has_shelter then
		print("shelter is here")
	end
	local pool_index = 1
	while pool_index <= #pool do
		local removed = false
		if has_seam and not string.match(pool[pool_index].key, "mega") then
			removed = true
			print("Seam says " .. pool[pool_indexi].key .. " isn't Mega! Remove it!")
		end
		if has_shelter and not string.match(pool[pool_index].key, "spectral") then
			removed = true
			print("Shelter says " .. pool[pool_index].key .. " isn't Spectral! Remove it!")
		end
		if removed then
			print("Removing " .. pool[pool_index].key .. " at position " .. tostring(pool_index))
			table.remove(pool, pool_index)
		else
			pool_index = pool_index + 1
		end
	end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "globals.lua"
pattern = "self.STATES = {    "
position = 'after'
payload = '''
    UTDR_SHOP_CAPSULE =		12.25,
    UTDR_SHOP_CATTYBRATTY =	159.2015,
    UTDR_SHOP_LACQUER =     67,
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if self.STATE == self.STATES.SHOP then 
'''
position = 'after'
payload = '''
	self:update_UTDR_shop_tabs(dt)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if self.shop then self.shop:remove(); self.shop = nil end
'''
position = 'after'
payload = '''
if self.UTDR_shop_tabs then self.UTDR_shop_tabs:remove(); self.UTDR_shop_tabs = nil end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = '''
if G.shop then G.shop.alignment.offset.y = G.ROOM.T.y+11 end
'''
position = 'after'
payload = '''
if G.UTDR_shop_capsule then
	--haha six seven six sevennnn
	if G.UTDR_shop_capsule then G.UTDR_shop_capsule.alignment.offset.y = 67 end
	if G.UTDR_shop_tabs then G.UTDR_shop_tabs.alignment.offset.y = 44 end
elseif G.shop then
	if G.UTDR_shop_tabs then G.UTDR_shop_tabs.alignment.offset.y = G.shop.alignment.offset.y + 10 end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = '''
G.booster_pack = UIBox{
	definition = self:create_UIBox(),
	config = {align="tmi", offset = {x=0,y=G.ROOM.T.y + 9}, major = G.hand, bond = 'Weak'}
}
'''
position = 'at'
payload = '''
if G.UTDR_shop_capsule then
	G.booster_pack = UIBox{
		definition = self:create_capsule_UIBox(),
		config = {align="tmi", offset = {x=0,y=G.ROOM.T.y + 9}, major = G.hand, bond = 'Weak'}
	}
else
	G.booster_pack = UIBox{
		definition = self:create_UIBox(),
		config = {align="tmi", offset = {x=0,y=G.ROOM.T.y + 9}, major = G.hand, bond = 'Weak'}
	}
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
G.shop.alignment.offset.y = -5.3
'''
position = 'at'
payload = '''
if G.SETTINGS.GRAPHICS.texture_scaling == 2 then
	G.shop.alignment.offset.y = -4.85
else
	G.shop.alignment.offset.y = -5.3
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "(self.config.type == 'deck' and self ~= G.deck) or"
position = "before"
payload = '''
(self.config.type == 'hand' and (state == G.STATES.UTDR_SHOP_CAPSULE or state == G.STATES.UTDR_SHOP_CATTYBRATTY or state == G.STATES.UTDR_SHOP_LACQUER)) or
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if self.STATE == self.STATES.GAME_OVER then
    self:update_game_over(dt)
end
'''
position = 'before'
payload = '''
if self.STATE == self.STATES.UTDR_SHOP_CATTYBRATTY then
	self:update_UTDR_shop_tabs(dt)
    self:update_utdr_shop_cattybratty(dt)
end
if self.STATE == self.STATES.UTDR_SHOP_CAPSULE then
	self:update_UTDR_shop_tabs(dt)
	self:update_UTDR_shop_capsule(dt)
end
if self.STATE == self.STATES.UTDR_SHOP_LACQUER then
    self:update_UTDR_shop_lacquer(dt)
end

'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if G.shop and not G.shop.alignment.offset.py then"
position = "before"
payload = '''
if G.UTDR_shop_tabs and not G.UTDR_shop_tabs.alignment.offset.py then
	G.UTDR_shop_tabs.alignment.offset.py = G.UTDR_shop_tabs.alignment.offset.y
	G.UTDR_shop_tabs.alignment.offset.y = G.ROOM.T.y + 31
end
if G.UTDR_shop_capsule and not G.UTDR_shop_capsule.alignment.offset.py then
	G.UTDR_shop_capsule.alignment.offset.py = G.UTDR_shop_capsule.alignment.offset.y
	G.UTDR_shop_capsule.alignment.offset.y = G.ROOM.T.y + 31
end
if G.utdr_shop_cattybratty and not G.utdr_shop_cattybratty.alignment.offset.py then
	G.utdr_shop_cattybratty.alignment.offset.py = G.utdr_shop_cattybratty.alignment.offset.y
	G.utdr_shop_cattybratty.alignment.offset.y = G.ROOM.T.y + 31
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if G.shop and G.shop.alignment.offset.py then"
position = "before"
payload = '''
if G.utdr_shop_cattybratty and G.utdr_shop_cattybratty.alignment.offset.py then 
	G.utdr_shop_cattybratty.alignment.offset.y = G.utdr_shop_cattybratty.alignment.offset.py
  	G.utdr_shop_cattybratty.alignment.offset.py = nil
end
if G.UTDR_shop_tabs and G.UTDR_shop_tabs.alignment.offset.py then 
	G.UTDR_shop_tabs.alignment.offset.y = G.UTDR_shop_tabs.alignment.offset.py
  	G.UTDR_shop_tabs.alignment.offset.py = nil
end
if G.UTDR_shop_capsule and G.UTDR_shop_capsule.alignment.offset.py then 
	G.UTDR_shop_capsule.alignment.offset.y = G.UTDR_shop_tabs.alignment.offset.py
  	G.UTDR_shop_capsule.alignment.offset.py = nilUTDR_shop_capsule
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
if G.shop then 
	G.shop.alignment.offset.y = G.shop.alignment.offset.py
	G.shop.alignment.offset.py = nil
  end
'''
position = "after"
payload = '''
if G.utdr_shop_cattybratty and G.utdr_shop_cattybratty.alignment.offset.py then 
	G.utdr_shop_cattybratty.alignment.offset.y = G.utdr_shop_cattybratty.alignment.offset.py
