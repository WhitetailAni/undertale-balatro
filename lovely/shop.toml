[manifest]
version = "1.0.0"
priority = 1

[vars]
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'if self.ability.rental then self.cost = 1 end'
position = 'after'
payload = '''
if #SMODS.find_card('j_UTDR_oddcontroller') > 0 and (self.config.center.rarity == 2 or self.config.center.rarity == 3) then self.cost = 0 end
if self.config.center.key == "j_UTDR_netskie" and key then self.cost = G.P_CENTERS[key].cost end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
function Card:set_cost()
    self.extra_cost = 0 + G.GAME.inflation

    self:set_cost_value()
    self:set_sell_value()
'''
position = "at"
payload = '''
function Card:set_cost(key)
    self.extra_cost = 0 + G.GAME.inflation

    self:set_cost_value(key)
    self:set_sell_value()
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
function Card:set_sell_value()
    self.sell_cost = math.max(1, math.floor(self.cost/2)) + (self.ability.extra_value or 0)
end
'''
position = "at"
payload = '''
function Card:set_sell_value()
    self.sell_cost = math.max(1, math.floor(self.cost/2)) + (self.ability.extra_value or 0)
    if self.config.center.key == "j_UTDR_netskie" and key then self.sell_cost = 2 end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "function Card:set_cost_value()"
position = "at"
payload = "function Card:set_cost_value(key)"
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/overrides.lua"]'''
pattern = '''
	local temp_in_pool = {}
    for k, v in ipairs(G.P_CENTER_POOLS['Booster']) do
'''
position = "at"
payload = '''
	local temp_in_pool = {}
	
	local booster_pool = {}
	if #SMODS.find_card('j_UTDR_shelter') > 0 and #SMODS.find_card('j_UTDR_seam') > 0 then
		for k, v in ipairs(G.P_CENTER_POOLS['Booster']) do
			if string.match(v.key, "spectral") and string.match(v.key, "mega") then
				booster_pool[#booster_pool + 1] = v
			end
		end
	elseif #SMODS.find_card('j_UTDR_seam') > 0 then
		for k, v in ipairs(G.P_CENTER_POOLS['Booster']) do
			if string.match(v.key, "mega") then
				booster_pool[#booster_pool + 1] = v
			end
		end
	elseif #SMODS.find_card('j_UTDR_shelter') > 0 then
		for k, v in ipairs(G.P_CENTER_POOLS['Booster']) do
			if string.match(v.key, "spectral") then
				booster_pool[#booster_pool + 1] = v
			end
		end
	else
		booster_pool = G.P_CENTER_POOLS['Booster']
	end
	
    for k, v in ipairs(booster_pool) do
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "globals.lua"
pattern = "self.STATES = {    "
position = 'after'
payload = '''
    UTDR_SHOP_CAPSULE =		12.25,
    UTDR_SHOP_CATTYBRATTY =	159.2015,
'''
match_indent = true


[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if self.STATE == self.STATES.GAME_OVER then
    self:update_game_over(dt)
end
'''
position = 'before'
payload = '''
if self.STATE == self.STATES.UTDR_SHOP_CAPSULE then
    self:update_utdr_shop_capsule(dt)
end
if self.STATE == self.STATES.UTDR_SHOP_CATTYBRATTY then
    self:update_utdr_shop_cattybratty(dt)
end

'''
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "(self.config.type == 'deck' and self ~= G.deck) or"
position = "before"
payload = '''
(self.config.type == 'hand' and (state == G.STATES.UTDR_SHOP_CAPSULE or G.STATES.UTDR_SHOP_CATTYBRATTY)) or
'''
match_indent = true
