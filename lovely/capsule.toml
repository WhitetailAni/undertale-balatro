[manifest]
version = "1.0.0"
priority = -2

[vars]

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if area and area.cards[1] then "
position = "at"
payload = "if area and area.cards and area.cards[1] then"
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "function CardArea:add_to_highlighted(card, silent)"
position = "after"
payload = "if self == G.UTDR_capsule_prize then return end"
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
G.SPLASH_BACK = Sprite(-30, -6, G.ROOM.T.w+60, G.ROOM.T.h+12, G.ASSET_ATLAS["ui_1"], {x = 2, y = 0})
'''
position = "before"
payload = '''
local gold_prizes = {
	"j_UTDR_fallen_human",
	"j_UTDR_kris",
	"j_UTDR_asriel",
	"j_UTDR_susie",
	"j_UTDR_asgore",
	"j_UTDR_dark_fountain",
	"j_UTDR_shadow_crystal",
	"j_UTDR_save",
	"j_UTDR_moss",
	"j_UTDR_toriel",
	"j_UTDR_temmie_armor",
	"j_blueprint",
	"j_brainstorm",
	"c_ectoplasm",
	"c_soul",
	"c_black_hole",
}
for key, value in pairs(G.P_CENTERS) do
	if value.set == "Voucher" then
		gold_prizes[#gold_prizes + 1] = key
	end
end
G.GAME.UTDR_capsule_gold_prizes = gold_prizes
UTDR_Modules.Capsule.total_gold_prizes = #gold_prizes
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
if G.shop and G.shop.alignment.offset.py then 
	G.shop.alignment.offset.y = G.shop.alignment.offset.py
  	G.shop.alignment.offset.py = nil
end
'''
position = "after"
payload = '''
if G.UTDR_shop_capsule and G.UTDR_shop_capsule.alignment.offset.py then 
	G.UTDR_shop_capsule.alignment.offset.y = G.UTDR_shop_capsule.alignment.offset.py
  	G.UTDR_shop_capsule.alignment.offset.py = nil
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.FUNCS.end_consumeable = function(e, delayfac)"
position = "after"
payload = '''
delayfac = delayfac or 0.0
if G.UTDR_shop_capsule then
	G.FUNCS.draw_from_hand_to_deck()
	G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.2*delayfac,blocking = false,
      func = function()
			G.STATE = G.STATES.UTDR_SHOP_CAPSULE
			G.STATE_COMPLETE = false
        return true
      end}))
      return true
end
'''
match_indent = true

