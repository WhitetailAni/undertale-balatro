[manifest]
version = "1.0.0"
priority = 0

[vars]

#voucher redeem
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = 'if self.ability.set == "Voucher" then'
position = "after"
payload = "	SMODS.calculate_context({voucher_redeem = true, voucher = self})"
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "check_for_unlock({type = 'blank_redeems'})"
position = "before"
payload = "SMODS.calculate_context({voucher_redeem = true, voucher = self})"
match_indent = true


#axe of justice total money spent
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "modifiers = {},"
position = "after"
payload = "money_spent = 0,"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if not G.from_boss_tag then ease_dollars(-10) end"
position = "at"
payload = '''
if not G.from_boss_tag then
	ease_dollars(-10)
	G.GAME.money_spent = G.GAME.money_spent + 10
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "ease_dollars(-G.GAME.current_round.reroll_cost)"
position = "at"
payload = '''
ease_dollars(-G.GAME.current_round.reroll_cost)
G.GAME.money_spent = G.GAME.money_spent + G.GAME.current_round.reroll_cost
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "ease_dollars(-c1.cost)"
position = "at"
payload = '''
ease_dollars(-c1.cost)
G.GAME.money_spent = G.GAME.money_spent + c1.cost
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
ease_dollars(-self.cost)
inc_career_stat('c_shop_dollars_spent', self.cost)
'''
position = "after"
payload = '''
G.GAME.money_spent = G.GAME.money_spent + self.cost
'''
match_indent = true

# Add Tenna sound blips
[[patches]]
[patches.pattern]
target = "card_character.lua"
position = "before"
pattern = "elseif quip.extra and quip.extra.sound then"
payload = '''
elseif self.config.args.tenna then
	play_sound('UTDR_tenna_blip_'..math.random(1, 10), 1, 0.5)
'''

match_indent = true