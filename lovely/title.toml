[manifest]
version = "1.0.0"
priority = 0

[vars]

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = 'replace_card.states.visible = false'
position = 'before'
payload = '''
SMODS.change_base(replace_card, "Hearts", nil)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
G.SPLASH_LOGO = Sprite(0, 0, 
        13*SC_scale, 
        13*SC_scale*(G.ASSET_ATLAS["balatro"].py/G.ASSET_ATLAS["balatro"].px),
        G.ASSET_ATLAS["balatro"], {x=0,y=0})
'''
position = 'at'
payload = '''
G.SPLASH_LOGO = Sprite(0, 0,
		13*SC_scale,
		13*SC_scale*(G.ASSET_ATLAS["UTDR_splash"].py/G.ASSET_ATLAS["UTDR_splash"].px),
		G.ASSET_ATLAS["UTDR_splash"], {x=0,y=0})
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = 'ease_background_colour{new_colour = G.C.BLACK, contrast = 1}'
position = 'at'
payload = 'ease_background_colour{new_colour = G.C.GASTER, contrast = 1}'
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
{name = 'colour_1', ref_table = G.C, ref_value = 'RED'},
{name = 'colour_2', ref_table = G.C, ref_value = 'BLUE'},
'''
position = 'at'
payload = '''
{name = 'colour_1', ref_table = G.C, ref_value = 'GASTER'},
{name = 'colour_2', ref_table = G.C, ref_value = 'BALLGAME'},
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
{name = 'colour_1', ref_table = G.C, ref_value = 'BLUE'},
{name = 'colour_2', ref_table = G.C, ref_value = 'WHITE'},
'''
position = 'at'
payload = '''
{name = 'colour_1', ref_table = G.C, ref_value = 'GASTER'},
{name = 'colour_2', ref_table = G.C, ref_value = 'BALLGAME'},
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "SC = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, G.P_CENTERS['j_joker'])"
position = "at"
payload = '''
local config = SMODS.find_mod('UTDR')[1].config
if math.fmod(os.time(), 4096) == 0 and config["undertale"] then
	if math.fmod(os.time(), 8192) == 0 then
		SC = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, G.P_CENTERS['j_UTDR_find_her_dogg_girl'], {bypass_discovery_center = true})
	else
		SC = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, G.P_CENTERS['j_UTDR_chara'], {bypass_discovery_center = true})
	end
else
	--local tv_world = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, config["deltarune"] and G.P_CENTERS['j_UTDR_tv_world'] or G.P_CENTERS['j_joker'], {bypass_discovery_center = true})
	SC = Card(G.ROOM.T.w/2 - SC_scale*G.CARD_W/2, 10. + G.ROOM.T.h/2 - SC_scale*G.CARD_H/2, SC_scale*G.CARD_W, SC_scale*G.CARD_H, G.P_CARDS.empty, config["undertale"] and G.P_CENTERS['j_UTDR_sans'] or G.P_CENTERS['j_joker'], {bypass_discovery_center = true})
	--[[if config["deltarune"] and not config["undertale"] then
		SC = tv_world
	elseif config["undertale"] and not config["deltarune"] then
		SC = sans
	else
		if math.fmod(os.time(), 2) == 0 then
			SC = tv_world
		else
			SC = sans
		end
	end]]
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''
G:save_settings()
G.FILE_HANDLER.force = true
'''
position = 'after'
payload = '''
local new_name = G.PROFILES[_profile].name
if new_name.upper(new_name) == "GASTER" then
	love.event.quit()
end
'''
match_indent = true