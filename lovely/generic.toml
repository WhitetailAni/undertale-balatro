#7 tags per row instead of 6 on just page 1 (so we dont add a whole extra page for just 4 tags)
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/overrides.lua"]'''
pattern = 'local cols = 6'
position = 'after'
payload = '''
if page == 1 then
	cols = 7
end
'''
match_indent = true

#G.GAME patches all in 1
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "STOP_USE = 0,"
position = "after"
payload = '''
dollar_max = 0,
discard_streak = 0,
money_spent = 0,
flowery_udid = 0,
utdr_trades = {},
UTDR_lacquer_script_step = 0,
'''
match_indent = true

