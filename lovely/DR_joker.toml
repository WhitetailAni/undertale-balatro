	if(self.config.center.rarity == 1 or self.config.center.rarity == 2) then
		self.cost = math.floor(self.cost * G.GAME.selected_back.effect.config.common_uncommon_multipler + 0.5)
	elseif(self.config.center.rarity == 3 or self.config.center.rarity == 4) then
		self.cost = math.floor(self.cost * G.GAME.selected_back.effect.config.rare_legendary_multiplier + 0.5)
	end
end end end
'''
