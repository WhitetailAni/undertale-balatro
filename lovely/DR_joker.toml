[manifest]
version = "1.0.0"
priority = -2

[vars]

#shadowguy chips-mult level up tampering
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = '''
context.old_parameters = {}
context.new_parameters = {}
'''
position = "after"
payload = '''
if args.from and args.from.config and args.from.config.center and args.from.config.center.key == "j_UTDR_shadowguy" then
	G.E_MANAGER:add_event(Event({
		func = function()
			play_sound(pseudorandom_element({"UTDR_shadowguy_1", "UTDR_shadowguy_2", "UTDR_shadowguy_3"}, "shadowguy_sfx"), 1.0, 0.7)
			return true
		end
	}))
end
'''
match_indent = true

#mizzle stuffs
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if obj.get_p_dollars and type(obj.get_p_dollars) == 'function' then
	ret = ret + obj:get_p_dollars(self)
elseif self.seal == 'Gold' and not self.ability.extra_enhancement then
	ret = ret +  3
end
'''
position = "at"
payload = '''
local mizzles = SMODS.find_card('j_UTDR_missmizzle')
if obj.get_p_dollars and type(obj.get_p_dollars) == 'function' then
	ret = ret + obj:get_p_dollars(self)
elseif (self.seal == 'Gold' or (#mizzles > 0 and self.seal ~= nil))and not self.ability.extra_enhancement then
	if self.seal ~= 'Gold' then
		for i = 1, #mizzles do
			G.E_MANAGER:add_event(Event({
				delay = 0.4,
				func = function() 
					mizzles[i]:juice_up(0.3, 0.4)
					return true
				end
			}))
		end
	end
	ret = ret +  3
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = "if G.GAME.used_vouchers.v_omen_globe and pseudorandom('omen_globe') > 0.8 then"
position = "at"
payload = '''
if #SMODS.find_card('j_UTDR_philosopher') > 0 and pseudorandom('philosopher') > 0.75 then
	_card = {set = "Planet", area = G.pack_cards, skip_materialize = true, soulable = true, key_append = "ar3"}
elseif G.GAME.used_vouchers.v_omen_globe and pseudorandom('omen_globe') > 0.8 then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = 'if not skip_increment then G.GAME.current_round.reroll_cost_increase = G.GAME.current_round.reroll_cost_increase + 1 end'
position = 'at'
payload = '''
if G.GAME.selected_back.name ~= "b_UTDR_forgotten" and not skip_increment then
	G.GAME.current_round.reroll_cost_increase = G.GAME.current_round.reroll_cost_increase + 1
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "if center_table.name == 'Reroll Surplus' or center_table.name == 'Reroll Glut' then"
position = 'at'
payload = "if (center_table.name == 'Reroll Surplus' or center_table.name == 'Reroll Glut') and G.GAME.selected_back.name ~= 'b_UTDR_forgotten' then"
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = "function SMODS.has_enhancement(card, key)"
position = "after"
payload = 'if #SMODS.find_card("j_UTDR_shackle") > 0 and ((card.config.center.key == "m_steel" and key == "m_gold") or (card.config.center.key == "m_gold" and key == "m_steel")) then return true end'
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "boot_timer('splash prep', 'end',1)"
position = "after"
payload = '''
if SMODS.find_mod('UTDR')[1].config["deltarune"] then
	self.shared_soul = Sprite(0, 0, self.CARD_W, self.CARD_H, self.ASSET_ATLAS['UTDR_consumables'], { x = 6, y = 5 })
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'if self.ability.rental then self.cost = 1 end'
position = 'after'
payload = '''
if G.GAME and G.GAME.selected_back and G.GAME.selected_back.name == "b_UTDR_merciful" then
	if(self.config.center.rarity == 1 or self.config.center.rarity == 2) then
		self.cost = math.max(1, math.floor(self.cost * G.GAME.selected_back.effect.config.common_uncommon_multipler + 0.5))
	elseif(self.config.center.rarity == 3 or self.config.center.rarity == 4) then
		self.cost = math.max(1, math.floor(self.cost * G.GAME.selected_back.effect.config.rare_legendary_multiplier + 0.5))
	end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'blind.lua'
pattern = '''
for i = 1, #G.jokers.cards do
	if G.jokers.cards[i].ability.crimson_heart_chosen then
		prev_chosen_set[G.jokers.cards[i]] = true
		G.jokers.cards[i].ability.crimson_heart_chosen = nil
		if G.jokers.cards[i].debuff then SMODS.recalc_debuff(G.jokers.cards[i]) end
	end
end
for i = 1, #G.jokers.cards do
	if not G.jokers.cards[i].debuff then
		if not prev_chosen_set[G.jokers.cards[i]] then
			jokers[#jokers+1] = G.jokers.cards[i]
		end
		table.insert(fallback_jokers, G.jokers.cards[i])
	end
end
if #jokers == 0 then jokers = fallback_jokers end 
local _card = pseudorandom_element(jokers, pseudoseed('crimson_heart'))
if _card then
	_card.ability.crimson_heart_chosen = true
	SMODS.recalc_debuff(_card)
	_card:juice_up()
	self:wiggle()
end
'''
position = 'at'
payload = '''
local flowery_index = 0
for i = 1, #G.jokers.cards do
	if G.jokers.cards[i].config.center.key == "j_UTDR_flowery" then
		flowery_index = i
	end
	if G.jokers.cards[i].ability.crimson_heart_chosen then
		prev_chosen_set[G.jokers.cards[i]] = true
		G.jokers.cards[i].ability.crimson_heart_chosen = nil
		if G.jokers.cards[i].debuff then SMODS.recalc_debuff(G.jokers.cards[i]) end
	end
end
for i = 1, #G.jokers.cards do
	if not G.jokers.cards[i].debuff then
		if not prev_chosen_set[G.jokers.cards[i]] then
			jokers[#jokers+1] = G.jokers.cards[i]
		end
		table.insert(fallback_jokers, G.jokers.cards[i])
	end
end
if #jokers == 0 then jokers = fallback_jokers end 
local _card = pseudorandom_element(jokers, pseudoseed('crimson_heart'))
if _card.config.center.key == "j_UTDR_flowery" then
	SMODS.play_sound("UTDR_flowery_nonono", 1.0, 0.7)
	--[[table.remove(jokers, flowery_index)
	_card = pseudorandom_element(jokers, pseudoseed('crimson_heart'))]]
end

if _card then
	_card.ability.crimson_heart_chosen = true
	SMODS.recalc_debuff(_card)
	_card:juice_up()
	self:wiggle()
end
'''
match_indent = true

