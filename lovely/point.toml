function add_round_points_row(config)
    local config = config or {}
    local width = G.round_eval.T.w - 0.51
    local points_amt = config.points or 1
    local scale = 0.9
    
    local rank = config.rank or "Z"
    local string = config.string or "" 

	total_cashout_rows = (total_cashout_rows or 0) + 1
	if total_cashout_rows > 7 then
		return
	end
	delay(0.4)

	G.E_MANAGER:add_event(Event({
		trigger = 'before',delay = 0.5,
		func = function()
			--Add the far left text and context first:
			local left_text = {}
			
			--rank
			table.insert(left_text, {n=G.UIT.T, config={text = rank, scale = 0.8*scale, colour = config.text_colour, shadow = true, juice = true}})
			
			--description
			table.insert(left_text, {n=G.UIT.O,config={object = DynaText({string = { string }, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
			local full_row = {n=G.UIT.R, config={align = "cm", minw = 5}, nodes={
				{n=G.UIT.C, config={padding = 0.05, minw = width*0.55, minh = 0.61, align = "cl"}, nodes=left_text},
				{n=G.UIT.C, config={padding = 0.05,minw = width*0.45, align = "cr"}, nodes={{n=G.UIT.C, config={align = "cm", id = 'dollar_'..config.name},nodes={}}}}
			}}
			
			G.round_eval:add_child(full_row,G.round_eval:get_UIE_by_ID(config.bonus and 'bonus_round_eval' or 'base_round_eval'))
			play_sound('cancel', config.pitch or 1)
			play_sound('highlight1',( 1.5*config.pitch) or 1, 0.2)
			if config.card then config.card:juice_up(0.7, 0.46) end
			return true
		end
	}))
	local points_row = 0
	G.E_MANAGER:add_event(Event({
		trigger = 'before',delay = 0.38,
		func = function()
			G.round_eval:add_child(
					{n=G.UIT.R, config={align = "cm", id = 'dollar_row_'..(points_row+1)..'_'..config.name}, nodes={
						{n=G.UIT.O, config={object = DynaText({string = {format_ui_value(points_amt)..localize("utdr_points_suffix")}, colours = {G.C.POINTS}, shadow = true, pop_in = 0, scale = 0.6, float = true})}}
					}},
					G.round_eval:get_UIE_by_ID('dollar_'..config.name))

			sfx_for_rank(rank)
			return true
		end
	}))
end

function eval_t_rank_tag(config)
    local config = config or {}
    local width = G.round_eval.T.w - 0.51
    local points_amt = config.points or 1
    local scale = 0.9

	total_cashout_rows = (total_cashout_rows or 0) + 1
	if total_cashout_rows > 7 then
		return
	end

	delay(0.4)

	G.E_MANAGER:add_event(Event({
		trigger = 'before',delay = 0.5,
		func = function()
			--Add the far left text and context first:
			local left_text = {}
			local blind_sprite = SMODS.create_sprite(0, 0, 0.7,0.7, 'UTDR_tag', copy_table(config.pos))
			blind_sprite:define_draw_steps({
				{shader = 'dissolve', shadow_height = 0.05},
				{shader = 'dissolve'}
			})
			blind_sprite:juice_up()
			table.insert(left_text, {n=G.UIT.O, config={w=0.7,h=0.7 , object = blind_sprite, hover = true, can_collide = false}})
			table.insert(left_text, {n=G.UIT.O, config={object = DynaText({string = {config.condition}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})                   
			
			local full_row = {n=G.UIT.R, config={align = "cm", minw = 5}, nodes={
				{n=G.UIT.C, config={padding = 0.05, minw = width*0.55, minh = 0.61, align = "cl"}, nodes=left_text},
				{n=G.UIT.C, config={padding = 0.05,minw = width*0.45, align = "cr"}, nodes={{n=G.UIT.C, config={align = "cm", id = 'dollar_'..config.name},nodes={}}}}
			}}
			
			G.round_eval:add_child(full_row,G.round_eval:get_UIE_by_ID(config.bonus and 'bonus_round_eval' or 'base_round_eval'))
			play_sound('cancel', config.pitch or 1)
			play_sound('highlight1',( 1.5*config.pitch) or 1, 0.2)
			if config.card then config.card:juice_up(0.7, 0.46) end
			return true
		end
	}))
	
	local points_row = 0
	G.E_MANAGER:add_event(Event({
		trigger = 'before',delay = 0.38,
		func = function()
			G.round_eval:add_child(
					{n=G.UIT.R, config={align = "cm", id = 'dollar_row_'..(points_row+1)..'_'..config.name}, nodes={
						{n=G.UIT.O, config={object = DynaText({string = {format_ui_value(points_amt)..localize("utdr_points_suffix")}, colours = {G.C.POINTS}, shadow = true, pop_in = 0, scale = 0.65, float = true})}}
					}},
					G.round_eval:get_UIE_by_ID('dollar_'..config.name))

			play_sound("UTDR_points6", 1.0, 0.5)
			return true
		end
	}))
end

