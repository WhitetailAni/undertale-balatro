[manifest]
version = "1.0.0"
priority = -2

[vars]

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = 'dollars = 0,'
position = 'after'
payload = 'points = 0,'
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
voucher_text = '',
dollars = 0,
'''
position = 'after'
payload = 'points_ante = 0,'
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/overrides.lua"]'''
pattern = 'SMODS.calculate_context({ante_change = mod, ante_end = SMODS.ante_end})'
position = 'before'
payload = 'G.GAME.ante_points = 0'
match_indent = true