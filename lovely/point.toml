[manifest]
version = "1.0.0"
priority = -2

[vars]

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = 'dollars = 0,'
position = 'after'
payload = 'UTDR_points = 0,'
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = 'used_vouchers = {},'
position = 'after'
payload = '''
ante = {
	total_chips_required = 0,
	chips_scored = 0,
	hands_played = 0,
	interest_earned = 0,
	points_to_be_gained = 0,
},
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/overrides.lua"]'''
pattern = 'SMODS.calculate_context({ante_change = mod, ante_end = SMODS.ante_end})'
position = 'before'
payload = '''
--probably not use
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''
add_round_eval_row({bonus = true, name='interest', pitch = pitch, dollars = G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)})
'''
position = 'before'
payload = '''
G.GAME.ante.interest_earned = G.GAME.ante.interest_earned + G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'blind.lua'
pattern = 'self.chips = get_blind_amount(G.GAME.round_resets.ante)*self.mult*G.GAME.starting_params.ante_scaling'
position = 'after'
payload = 'G.GAME.ante.total_chips_required = G.GAME.ante.total_chips_required + self.chips'
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''
G.GAME.hands_played = G.GAME.hands_played + 1
G.GAME.current_round.hands_played = G.GAME.current_round.hands_played + 1
'''
position = 'after'
payload = '''
G.GAME.ante.hands_played = G.GAME.ante.hands_played + 1
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'SMODS.last_hand_score = SMODS.calculate_round_score()'
position = 'after'
payload = 'G.GAME.ante.chips_scored = G.GAME.ante.chips_scored + SMODS.calculate_round_score()'
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = 'ease_dollars(G.GAME.current_round.dollars)'
position = 'after'
payload = '''
if G.GAME.ante.points_to_be_gained > 0 then
	UTDR_Modules.Capsule.ease_points(G.GAME.ante.points_to_be_gained)
	if G.GAME.ante.points_to_be_gained >= 1000 then
		play_sound('UTDR_points20', 1.0, 0.6)
	elseif G.GAME.ante.points_to_be_gained >= 600 then
		play_sound('UTDR_points15', 1.0, 0.6)
	else
		play_sound('UTDR_points10', 1.0, 0.6)
	end
	G.GAME.ante.points_to_be_gained = 0
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = "local blind_sprite = SMODS.create_sprite(0, 0, 0.7,0.7, 'tags', copy_table(config.pos))"
position = 'after'
payload = '''
if config.tag.key == "tag_UTDR_t_rank" then
	local blind_sprite = SMODS.create_sprite(0, 0, 0.7,0.7, 'UTDR_tag', copy_table(config.pos))
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''
	dollars = dollars + G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)
end
'''
position = 'after'
payload = '''
if G.GAME.blind.boss then
	--set up local equivalents to G.GAME.ante.* so i dont have to type them as much
	local total_chips = G.GAME.ante.total_chips_required
	local chips_scored = G.GAME.ante.chips_scored
	local hands_played = G.GAME.ante.hands_played
	local interest_earned = G.GAME.ante.interest_earned
	
	local chips_rank = "Z"
	local hand_rank = "Z"
	local interest_rank = "Z"
	
	for i = 1, #G.vouchers.cards do
		if G.vouchers.cards[i].config.center_key == "v_UTDR_rippling_stars" then
			chips_rank = "C"
			hand_rank = "C"
			interest_rank = "C"
			break
		end
	end
	
	if chips_scored / total_chips >= 100 then
		chips_rank = "T"
	elseif chips_scored / total_chips >= 20 then
		chips_rank = "S"
	elseif chips_scored / total_chips >= 5 then
		chips_rank = "A"
	elseif chips_scored / total_chips >= 2 then
		chips_rank = "B"
	elseif chips_scored / total_chips >= 1.25 then --"uuuuhh but how are you gonna get less than the total ante chip requirements" the elegant and beautiful BLUE???????????????????
	--i know the above comment doesnt make any sense. Z rank used to be below 1x required ante chips, we adjusted it
		chips_rank = "C"
	end
	
	if hands_played <= 1 then
		hand_rank = "T"
	elseif hands_played <= 3 then
		hand_rank = "S"
	elseif hands_played <= 5 then
		hand_rank = "A"
	elseif hands_played <= 7 then
		hand_rank = "B"
	elseif hands_played <= 9 then
		hand_rank = "C"
	end
	
	if interest_earned >= 15 then
		interest_rank = "T"
	elseif interest_earned >= 12 then
		interest_rank = "S"
	elseif interest_earned >= 8 then
		interest_rank = "A"
	elseif interest_earned >= 4 then
		interest_rank = "B"
	elseif interest_earned >= 1 then
		interest_rank = "C"
	end
	
	local chips_points = points_from_rank(chips_rank, 250, 50)
	local hand_points = points_from_rank(hand_rank, 250, 50)
	local interest_points = points_from_rank(interest_rank, 200, 40)
	
	local fallen_star = 0 --NOT 9 DO NOT GIVE 9 FREE POINTS FOR S + T RANK YOU SOUPID
	for i = 1, #G.vouchers.cards do
		if G.vouchers.cards[i].config.center_key == "v_UTDR_fallen_star" then
			fallen_star = G.vouchers.cards[i].ability.points
			break
		end
	end
	
	if fallen_star then
		if chips_rank == "T" then
			chips_points = chips_points + fallen_star
		end
		if hand_rank == "T" then
			hand_points = hand_points + fallen_star
		end
		if interest_rank == "T" then
			interest_points = interest_points + fallen_star
		end
	end
	
	local total_points = 0
	
	total_points = total_points + chips_points
	total_points = total_points + hand_points
	total_points = total_points + interest_points
	
	add_round_points_row({points = chips_points, bonus = true, name='chips_points'..i, pitch = pitch, text_colour = color_for_rank(chips_rank), rank = chips_rank, string = " Chips scored", text_scale = 0.6})
	pitch = pitch + 0.06
	add_round_points_row({points = hand_points, bonus = true, name='hand_points'..i, pitch = pitch, text_colour = color_for_rank(hand_rank), rank = hand_rank, string = " Hands played", text_scale = 0.6})
	pitch = pitch + 0.06
	add_round_points_row({points = interest_points, bonus = true, name='interest_points'..i, pitch = pitch, text_colour = color_for_rank(interest_rank), rank = interest_rank, string = " Interest earned", text_scale = 0.6})
	pitch = pitch + 0.06
	
	for i = 1, #G.GAME.tags do
		local tag = G.GAME.tags[i]
		if tag.key == "tag_UTDR_t_rank" then
			total_points = total_points + tag.config.points
			tag:yep('+', G.C.POINTS, function()
				return true
			end)
			eval_t_rank_tag({points = tag.config.points, bonus = true, name='tag'..i, pitch = pitch, condition = localize('ph_defeat_the_boss'), pos = tag.pos, tag = tag})
			pitch = pitch + 0.06
			tag.triggered = true
		end
	end

	--reset trackers to 0 after all calculation is done
	G.GAME.ante.total_chips_required = 0
	G.GAME.ante.chips_scored = 0
	G.GAME.ante.hands_played = 0
	G.GAME.ante.interest_earned = 0
	
	G.GAME.ante.points_to_be_gained = total_points --(so you can cash-out properly)
end
'''
match_indent = true

